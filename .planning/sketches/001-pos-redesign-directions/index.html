<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Redesign — 5 Directions v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ============================= RESET / BASE ============================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#000;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-top:44px}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
input{font:inherit}
svg{display:block}
.ic{width:17px;height:17px;stroke-width:2px;flex-shrink:0}
.ic-sm{width:13px;height:13px}
.ic-lg{width:24px;height:24px}
::selection{background:rgba(255,255,255,.2)}
@property --angle{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin-angle{to{--angle:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite}

/* ============================= TOP VARIANT NAV ============================= */
#variant-nav{position:fixed;top:0;left:0;right:0;height:44px;z-index:9998;background:#000;border-bottom:1px solid #262626;display:flex;align-items:stretch;overflow-x:auto;font-size:12.5px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif}
#variant-nav .variant-tab{background:none;border:none;border-right:1px solid #1c1c1c;color:#8a8a8a;padding:0 18px;white-space:nowrap;transition:background .15s ease,color .15s ease}
#variant-nav .variant-tab:hover{color:#e5e5e5;background:#111}
#variant-nav .variant-tab.active{color:#fff;background:#1a1a1a;box-shadow:inset 0 -2px 0 #fff}

/* ============================= APP SHELL ============================= */
.variant{min-height:calc(100vh - 44px)}
.app-shell{display:flex;min-height:calc(100vh - 44px)}
.sidebar{width:210px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:44px;height:calc(100vh - 44px);padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.brand-mark{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-weight:800;font-size:14px;line-height:1.15}
.brand-sub{font-size:10.5px;opacity:.5}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;border:none;background:none;text-align:left;position:relative;transition:.15s ease}
.side-foot{padding:12px 8px 4px;display:flex;align-items:center;gap:10px;font-size:12px}
.side-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.side-status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}

.main{flex:1;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;position:sticky;top:44px;z-index:20}
.topbar-title{font-size:17px;font-weight:800}
.topbar-right{display:flex;align-items:center;gap:14px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;position:relative}
.badge-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%}
.content{padding:6px 30px 70px}
.screen[hidden]{display:none}

/* ============================= HOME DASHBOARD ============================= */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;opacity:.5;margin:0 0 6px}
.h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;line-height:1.1}
.sub{opacity:.55;font-size:13.5px;margin:0 0 20px}
.alert-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;margin-bottom:20px;font-size:12.5px;font-weight:600;border-radius:999px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{padding:16px 18px;border-radius:16px;position:relative;overflow:hidden}
.stat-label{font-size:11px;opacity:.55;font-weight:600;margin-bottom:6px}
.stat-value{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.stat-trend{font-size:11px;margin-top:4px;font-weight:600}

.home-cols{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.cta-card{padding:24px;border-radius:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.cta-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.cta-btn{border:none;padding:11px 20px;border-radius:999px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.activity-card{padding:8px 20px;border-radius:18px}
.activity-row{display:flex;align-items:center;gap:12px;padding:13px 0}
.activity-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.activity-name{font-weight:700;font-size:13px}
.activity-meta{font-size:11.5px;opacity:.5}
.activity-amount{font-weight:800;font-size:13.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.status-pill{padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;margin-left:10px;white-space:nowrap}

/* ============================= POS / CHECKOUT ============================= */
.cat-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.cat-pill{padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;border:none;transition:.15s ease}
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:980px){.pos-layout{grid-template-columns:1fr}}
.search-row{display:flex;gap:10px;margin-bottom:16px}
.search-input{flex:1;padding:12px 16px;border-radius:12px;font-size:14px;border:none;outline:none}
.scan-btn{padding:12px 18px;border-radius:12px;font-weight:700;border:none;white-space:nowrap;display:flex;align-items:center;gap:8px}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.product-card{padding:14px 10px 12px;cursor:pointer;transition:transform .15s ease;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative}
.product-card:active{transform:scale(.95)}
.product-photo{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:2px;position:relative}
.product-qty-badge{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;padding:0 4px;border-radius:999px;font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center}
.product-add-btn{position:absolute;bottom:10px;right:10px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none}
.product-name{font-weight:700;font-size:12.5px;line-height:1.25}
.product-price{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
.product-stock{font-size:10px;opacity:.45}

.ticket-panel{padding:18px;border-radius:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:112px}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline}
.ticket-num{font-weight:800;font-size:14px}
.ticket-clear{font-size:11.5px;opacity:.55;cursor:pointer;display:flex;align-items:center;gap:4px}
.ticket-field{padding:9px 12px;border-radius:10px;font-size:12.5px;border:none;width:100%;outline:none}
.cart-item{display:flex;align-items:center;gap:10px;padding:9px 0}
.cart-item-name{flex:1;font-size:13px;font-weight:600}
.cart-item-unit{font-size:10.5px;opacity:.45}
.qty-group{display:flex;align-items:center;gap:6px;border-radius:999px;padding:2px}
.qty-btn{width:22px;height:22px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center}
.qty-val{min-width:16px;text-align:center;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.line-total{font-weight:700;font-size:12.5px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.cart-totals{display:flex;flex-direction:column;gap:6px;font-size:13px;padding-top:8px}
.cart-totals .row{display:flex;justify-content:space-between}
.cart-totals .row .val{font-variant-numeric:tabular-nums}
.cart-totals .row.total{font-size:18px;font-weight:800;padding-top:6px}
.btn-pill-lg{border:none;padding:15px;border-radius:999px;font-weight:800;font-size:14.5px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}

/* ============================= PAYMENT ============================= */
.payment-layout{display:grid;grid-template-columns:1fr 320px;gap:24px}
@media (max-width:980px){.payment-layout{grid-template-columns:1fr}}
.tender-seg{display:flex;padding:4px;border-radius:999px;margin-bottom:20px;gap:4px}
.tender-btn{flex:1;padding:12px 8px;border-radius:999px;border:none;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:12.5px;transition:.2s ease;position:relative}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:300px}
.key{padding:15px;border-radius:12px;border:none;font-weight:700;font-size:16px;text-align:center;transition:transform .1s ease}
.quick-cash{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{padding:7px 14px;border-radius:999px;border:none;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.order-summary{padding:20px;border-radius:18px;position:relative}

/* ============================= RECEIPT ============================= */
.receipt-wrap{display:flex;justify-content:center;padding:20px 0}
.receipt{width:100%;max-width:370px;padding:26px;display:flex;flex-direction:column;gap:11px;position:relative;border-radius:18px}
.receipt-line{display:flex;justify-content:space-between;font-size:12.5px}
.receipt-actions{display:flex;gap:10px;margin-top:14px}
.receipt-actions button{flex:1;padding:12px;border-radius:999px;border:none;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}

/* border-trail animated ring */
.trail{position:relative}
.trail::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--angle,0deg),transparent 55%,var(--trail-c,#fff) 78%,transparent 92%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin-angle 2.4s linear infinite;pointer-events:none}
/* spotlight-follow */
.spotlight{position:relative;overflow:hidden}
.spotlight::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),transparent 70%)}
.spotlight:hover::after{opacity:1}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.1);z-index:9999;border:1px solid #333;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;border-radius:8px;opacity:.5;transition:opacity .2s;display:flex;gap:10px;align-items:center}
#sketch-tools:hover{opacity:1}
#sketch-tools button{background:#222;color:#fff;border:1px solid #444;border-radius:5px;padding:3px 8px;font-size:11px}

/* ============================= A. TACTILE BIG-TOUCH RETAIL ============================= */
#v-a{--bg:#241a12;--surface:#2f2216;--surface2:#3a2a1a;--surface3:#443118;--text:#fdf3e7;--muted:#c9ac8c;--primary:#ff7a1a;--primary-text:#1a0f05;--accent:#ffb347;--success:#5fc46a;--danger:#ff5a5a;--border:#4a3520;--radius:18px;background:radial-gradient(ellipse at top left,#2c2015,var(--bg) 60%);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
#v-a .sidebar{background:var(--surface);border-right:1px solid var(--border)}
#v-a .brand-mark{background:var(--primary);color:var(--primary-text)}
#v-a .side-link{color:var(--muted)}
#v-a .side-link.active{background:var(--primary);color:var(--primary-text)}
#v-a .side-link:hover:not(.active){background:var(--surface2);color:var(--text)}
#v-a .side-foot{border-top:1px solid var(--border)}
#v-a .side-avatar{background:var(--surface2);color:var(--accent)}
#v-a .topbar{background:rgba(36,26,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
#v-a .icon-btn{background:var(--surface2);color:var(--text)}
#v-a .badge-dot{background:var(--primary);border:2px solid var(--surface2)}
#v-a .alert-pill{background:var(--surface2);border:1px solid var(--border);color:var(--accent)}
#v-a .stat-card{background:var(--surface);border:1px solid var(--border)}
#v-a .stat-trend.up{color:var(--success)}
#v-a .stat-trend.warn{color:var(--accent)}
#v-a .cta-card{background:linear-gradient(155deg,var(--primary),#e0620a);color:var(--primary-text)}
#v-a .cta-icon{background:rgba(26,15,5,.2)}
#v-a .cta-btn{background:var(--primary-text);color:var(--primary)}
#v-a .activity-card{background:var(--surface);border:1px solid var(--border)}
#v-a .activity-row{border-bottom:1px solid var(--border)}
#v-a .activity-row:last-child{border-bottom:none}
#v-a .activity-avatar{background:var(--surface2);color:var(--accent)}
#v-a .activity-meta{color:var(--muted)}
#v-a .status-pill.paid{background:rgba(95,196,106,.15);color:var(--success)}
#v-a .status-pill.refund{background:rgba(255,90,90,.15);color:var(--danger)}
#v-a .cat-pill{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
#v-a .cat-pill.active{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
#v-a .search-input{background:var(--surface);color:var(--text);border:2px solid var(--border)}
#v-a .search-input::placeholder{color:var(--muted)}
#v-a .scan-btn{background:var(--primary);color:var(--primary-text)}
#v-a .product-card{background:var(--surface);border:1px solid var(--border)}
#v-a .product-photo{background:var(--surface3);color:var(--accent)}
#v-a .product-qty-badge{background:var(--primary);color:var(--primary-text)}
#v-a .product-add-btn{background:var(--primary);color:var(--primary-text)}
#v-a .product-price{color:var(--accent)}
#v-a .product-stock{color:var(--muted)}
#v-a .ticket-panel{background:var(--surface);border:1px solid var(--border)}
#v-a .ticket-field{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
#v-a .cart-item{border-bottom:1px solid var(--border)}
#v-a .cart-item-unit{color:var(--muted)}
#v-a .qty-group{background:var(--surface2)}
#v-a .qty-btn{background:var(--surface3);color:var(--text)}
#v-a .cart-totals{color:var(--muted);border-top:1px solid var(--border)}
#v-a .cart-totals .row.total{color:var(--text)}
#v-a .btn-pill-lg{background:var(--primary);color:var(--primary-text);box-shadow:0 10px 22px -6px rgba(255,122,26,.5)}
#v-a .tender-seg{background:var(--surface)}
#v-a .tender-btn{color:var(--muted)}
#v-a .tender-btn.active{background:var(--primary);color:var(--primary-text);--trail-c:var(--accent)}
#v-a .keypad .key{background:var(--surface);color:var(--text);border:1px solid var(--border)}
#v-a .chip{background:var(--surface2);color:var(--accent);border:1px solid var(--border)}
#v-a .order-summary{background:var(--surface);border:1px solid var(--border)}
#v-a .receipt{background:var(--surface);border:1px solid var(--border)}
#v-a .receipt-line{color:var(--muted)}
#v-a .receipt-actions button{background:var(--surface2);color:var(--text)}
#v-a .receipt-actions button.primary{background:var(--primary);color:var(--primary-text)}

/* ============================= B. DATA-DENSE PRO TERMINAL ============================= */
#v-b{--bg:#0a0d12;--surface:#12161d;--surface2:#181e27;--surface3:#1e252f;--text:#e6edf3;--muted:#71808f;--primary:#3fb950;--primary-text:#04150a;--accent:#58a6ff;--success:#3fb950;--danger:#f85149;--border:#212932;--radius:6px;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans','IBM Plex Mono',monospace}
#v-b .sidebar{background:var(--surface);border-right:1px solid var(--border)}
#v-b .brand-mark{background:var(--surface2);color:var(--primary);border:1px solid var(--border)}
#v-b .brand-name,#v-b .topbar-title{font-family:'IBM Plex Mono',monospace}
#v-b .side-link{color:var(--muted);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
#v-b .side-link.active{background:var(--surface2);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
#v-b .side-link:hover:not(.active){background:var(--surface2)}
#v-b .side-foot{border-top:1px solid var(--border);font-family:'IBM Plex Mono',monospace}
#v-b .side-avatar{background:var(--surface2);color:var(--accent);border-radius:4px}
#v-b .topbar{background:rgba(10,13,18,.92);border-bottom:1px solid var(--border)}
#v-b .icon-btn{background:var(--surface2);color:var(--text);border-radius:4px;border:1px solid var(--border)}
#v-b .badge-dot{background:var(--danger);border:2px solid var(--surface2)}
#v-b .alert-pill{background:#1c150a;border:1px solid #3d2a0e;color:#f0a53c;border-radius:4px;font-family:'IBM Plex Mono',monospace}
#v-b .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:6px}
#v-b .stat-value{font-family:'IBM Plex Mono',monospace}
#v-b .stat-trend.up{color:var(--success)}
#v-b .stat-trend.warn{color:#f0a53c}
#v-b .cta-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px}
#v-b .cta-icon{background:var(--surface3);color:var(--primary);border-radius:4px}
#v-b .cta-btn{background:var(--primary);color:var(--primary-text);border-radius:4px;font-family:'IBM Plex Mono',monospace}
#v-b .activity-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;font-family:'IBM Plex Mono',monospace}
#v-b .activity-row{border-bottom:1px solid var(--border)}
#v-b .activity-row:last-child{border-bottom:none}
#v-b .activity-avatar{background:var(--surface2);color:var(--accent);border-radius:4px}
#v-b .activity-meta{color:var(--muted)}
#v-b .status-pill{border-radius:4px}
#v-b .status-pill.paid{background:rgba(63,185,80,.15);color:var(--success)}
#v-b .status-pill.refund{background:rgba(248,81,73,.15);color:var(--danger)}
#v-b .cat-pill{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
#v-b .cat-pill.active{background:var(--surface2);color:var(--accent);border-color:var(--accent)}
#v-b .search-input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:13px}
#v-b .scan-btn{background:var(--surface2);color:var(--accent);border:1px solid var(--border);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px}
#v-b .product-card{background:var(--surface);border:1px solid var(--border);border-radius:6px}
#v-b .product-photo{background:var(--surface3);color:var(--accent);border-radius:6px}
#v-b .product-qty-badge{background:var(--primary);color:var(--primary-text);border-radius:4px}
#v-b .product-add-btn{background:var(--surface3);color:var(--primary);border:1px solid var(--border);border-radius:4px}
#v-b .product-price{color:var(--primary);font-family:'IBM Plex Mono',monospace}
#v-b .product-stock{color:var(--muted)}
#v-b .ticket-panel{background:var(--surface);border:1px solid var(--border);border-radius:6px}
#v-b .ticket-field{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:'IBM Plex Mono',monospace}
#v-b .cart-item{border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:12px}
#v-b .cart-item-unit{color:var(--muted)}

/* ============================= INTERACTIVITY ============================= */
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML = '<i data-lucide="check" class="ic-sm"></i>'+msg;
  if(window.lucide) lucide.createIcons();
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('show'),1500);
}
function animateValue(el, to, prefix){
  prefix = prefix===undefined ? '$' : prefix;
  const from = parseFloat((el.dataset.val||el.textContent||'0').replace(/[^0-9.\-]/g,'')) || 0;
  const start = performance.now(); el.dataset.val = to; const dur=380;
  function tick(now){
    const p=Math.min(1,(now-start)/dur); const eased=1-Math.pow(1-p,3);
    el.textContent=prefix+(from+(to-from)*eased).toFixed(2);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function switchScreen(variant, screenName){
  variant.querySelectorAll('.side-link').forEach(l=>l.classList.toggle('active', l.dataset.screen===screenName));
  const navObj = V[variant.dataset.variant].nav;
  const titleEl = variant.querySelector('.topbar-title');
  if(titleEl && navObj[screenName]) titleEl.textContent = navObj[screenName];
  variant.querySelectorAll('.screen').forEach(s=>{ s.hidden = s.dataset.screenPanel!==screenName; });
}
function recalcCart(variant){
  let subtotal=0;
  variant.querySelectorAll('.cart-item').forEach(row=>{
    const price=parseFloat(row.dataset.price), qty=parseInt(row.querySelector('.qty-val').textContent,10);
    subtotal+=price*qty; animateValue(row.querySelector('.line-total'), price*qty);
  });
  const tax=subtotal*0.08, total=subtotal+tax;
  variant.querySelectorAll('.subtotal-val').forEach(el=>animateValue(el, subtotal));
  variant.querySelectorAll('.tax-val').forEach(el=>animateValue(el, tax));
  variant.querySelectorAll('.total-val').forEach(el=>animateValue(el, total));
}
function wireVariant(variant){
  variant.querySelectorAll('.side-link, [data-goto]').forEach(el=>{
    el.addEventListener('click', ()=>switchScreen(variant, el.dataset.screen||el.dataset.goto));
  });
  variant.querySelectorAll('.cat-pill').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      variant.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));
      pill.classList.add('active');
      const cat = pill.dataset.cat;
      variant.querySelectorAll('.product-card').forEach(card=>{
        card.style.display = (cat==='all'||card.dataset.cat===cat) ? '' : 'none';
      });
    });
  });
  variant.querySelectorAll('.qty-inc,.qty-dec').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const row=btn.closest('.cart-item'), qtyEl=row.querySelector('.qty-val');
      let qty=parseInt(qtyEl.textContent,10);
      qty = btn.classList.contains('qty-inc') ? qty+1 : Math.max(1,qty-1);
      qtyEl.textContent=qty; recalcCart(variant);
    });
  });
  variant.querySelectorAll('.product-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const badge = card.querySelector('.product-qty-badge');
      const n = (parseInt(badge.textContent,10)||0)+1;
      badge.textContent = n; badge.style.display='flex';
      showToast((card.dataset.name||'Item')+' added');
    });
  });
  variant.querySelectorAll('.tender-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      variant.querySelectorAll('.tender-btn').forEach(b=>b.classList.remove('active','trail'));
      btn.classList.add('active','trail');
    });
  });
  variant.querySelectorAll('.key, .chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ btn.style.transform='scale(.9)'; setTimeout(()=>btn.style.transform='',110); });
  });
  variant.querySelectorAll('.btn-complete-sale').forEach(btn=>{
    const original=btn.innerHTML;
    btn.addEventListener('click', ()=>{
      btn.innerHTML='<i data-lucide="loader-2" class="ic spin"></i> …';
      if(window.lucide) lucide.createIcons();
      setTimeout(()=>{ switchScreen(variant,'receipt'); btn.innerHTML=original; if(window.lucide) lucide.createIcons(); showToast('Sale complete'); }, 500);
    });
  });
}
document.querySelectorAll('.variant').forEach(wireVariant);

/* spotlight-follow cursor */
document.addEventListener('pointermove', (e)=>{
  const el = e.target.closest ? e.target.closest('.spotlight') : null;
  if(!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--mx', (e.clientX-r.left)+'px');
  el.style.setProperty('--my', (e.clientY-r.top)+'px');
});
/* tilt on hover */
document.querySelectorAll('.tilt').forEach(el=>{
  el.addEventListener('mousemove', e=>{
    const r=el.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
    el.style.transform=`perspective(700px) rotateX(${(-py*6).toFixed(2)}deg) rotateY(${(px*6).toFixed(2)}deg)`;
  });
  el.addEventListener('mouseleave', ()=>{ el.style.transform=''; });
});
/* magnetic buttons */
document.querySelectorAll('.magnetic').forEach(el=>{
  el.addEventListener('mousemove', e=>{
    const r=el.getBoundingClientRect();
    const mx=(e.clientX-r.left-r.width/2)*0.18, my=(e.clientY-r.top-r.height/2)*0.25;
    el.style.transform=`translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
  });
  el.addEventListener('mouseleave', ()=>{ el.style.transform=''; });
});
/* top-level variant switcher */
document.querySelectorAll('#variant-nav .variant-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const target = tab.dataset.variantTarget;
    document.querySelectorAll('#variant-nav .variant-tab').forEach(t=>t.classList.toggle('active', t===tab));
    document.querySelectorAll('.variant').forEach(v=>{ v.hidden = v.dataset.variant!==target; });
    window.scrollTo({top:0,behavior:'instant'});
  });
});
