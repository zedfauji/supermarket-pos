[package]
name = "print-broker-spike"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "broker"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"]

[profile.dev]
opt-level = 0
