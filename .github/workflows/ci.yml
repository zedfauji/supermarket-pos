name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality:
    name: Typecheck / Lint / Test / Audit
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Security audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

  tauri-build:
    name: Tauri Native Build (Windows)
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prefer Git Bash over the WSL bash.exe stub
        # dtolnay/rust-toolchain's internal script needs a real /bin/bash. On this
        # runner, C:\Windows\System32 (containing the WSL launcher stub bash.exe)
        # comes before Git's bin dir on PATH, and the default WSL distro here
        # (docker-desktop) has no usable /bin/bash — that combination fails with
        # "execvpe(/bin/bash) failed: No such file or directory". Prepending Git's
        # real bash.exe to PATH via GITHUB_PATH fixes resolution for every later
        # step in this job.
        shell: pwsh
        run: echo 'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Tauri native build
        run: npm run tauri build -- --ci --no-bundle
