name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality:
    name: Typecheck / Lint / Test / Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supermarket-pos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: supermarket-pos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Security audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

  tauri-build:
    name: Tauri Native Build (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supermarket-pos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: supermarket-pos/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: supermarket-pos/src-tauri

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Rust unit tests
        working-directory: supermarket-pos/src-tauri
        run: cargo test

      - name: Tauri native build
        run: npm run tauri build -- --ci --no-bundle
