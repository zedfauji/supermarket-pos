name: publish
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  read-manifest:
    runs-on: [self-hosted, windows]
    outputs:
      active_customers: ${{ steps.filter.outputs.active_customers }}
    steps:
      - uses: actions/checkout@v4

      - name: Read active customers from manifest
        id: filter
        shell: pwsh
        run: |
          . scripts/lib/customer-manifest.ps1
          $active = @(Get-ActiveCustomers -ManifestPath 'customers/customers.json')
          $json = $active | ConvertTo-Json -Compress -AsArray
          echo "active_customers=$json" >> $env:GITHUB_OUTPUT
          Write-Host "OK: $($active.Count) active customer(s): $($active.name -join ', ')" -ForegroundColor Green

  sync-customers:
    needs: [read-manifest]
    if: needs.read-manifest.outputs.active_customers != '[]'
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJson(needs.read-manifest.outputs.active_customers) }}
    permissions:
      contents: write
    environment:
      name: ${{ matrix.customer.github_environment }}
    runs-on: [self-hosted, windows]
    steps:
      - name: Validate customer manifest fields (T-26-03)
        # customers.json is committed/human-edited, but its name/repo fields
        # become untrusted input the moment they're interpolated into the
        # git remote add / git push shell commands below. Reject anything
        # outside a strict allow-list BEFORE any git/gh command runs, so a
        # malformed or malicious manifest entry fails loudly here instead of
        # being shelled out.
        shell: pwsh
        run: |
          $name = '${{ matrix.customer.name }}'
          $repoSlug = ('${{ matrix.customer.repo }}' -split '/')[-1]
          if ($name -notmatch '^[a-z0-9-]+$') {
            Write-Host "FAILED: customer.name '$name' contains characters outside the allow-list ^[a-z0-9-]+$ - refusing to proceed (T-26-03)." -ForegroundColor Red
            exit 1
          }
          if ($repoSlug -notmatch '^[a-z0-9-]+$') {
            Write-Host "FAILED: customer.repo slug '$repoSlug' (from '${{ matrix.customer.repo }}') contains characters outside the allow-list ^[a-z0-9-]+$ - refusing to proceed (T-26-03)." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: customer.name '$name' and repo slug '$repoSlug' pass allow-list validation." -ForegroundColor Green

      - uses: actions/checkout@v4
        with:
          # git push --mirror needs full history — actions/checkout defaults to
          # a shallow (depth=1) fetch, which produces an incomplete object pack
          # that the remote rejects ("did not receive expected object" /
          # "index-pack failed"). D-01/D-02 require a full mirror of every ref.
          fetch-depth: 0

      # Isolate CI's npm cache from the runner machine's interactive user npm-cache
      # (both share the same Windows account) — actions/setup-node's cache-save step
      # was hanging on `tar: Permission denied` against npm-cache/_logs/*.log files
      # locked by concurrently-running interactive node/npm processes on this box.
      # `runner.temp` is only valid in step-level (not job-level) `env:`.
      - name: setup node
        uses: actions/setup-node@v4
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup show

      - name: install frontend dependencies
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        run: npm ci

      - name: Materialize .env.production from Environment secrets
        shell: pwsh
        run: |
          # Values are sourced from this customer's own GitHub Environment (this
          # job's `environment:` binding above scopes secret resolution to exactly
          # this customer's Environment). Never echo the values themselves.
          $supabaseUrl = "https://${{ matrix.customer.supabase_project_ref }}.supabase.co"
          @"
          VITE_SUPABASE_URL=$supabaseUrl
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          "@ | Set-Content -Path .env.production -Encoding utf8 -NoNewline
          Write-Host "OK: .env.production materialized for ${{ matrix.customer.name }}'s build window." -ForegroundColor Green

      - name: Mirror-push to customer repo
        # shell: bash resolves to WSL's bash.exe shim (C:\WINDOWS\system32\bash.EXE)
        # on this self-hosted Windows runner, not Git Bash — WSL has no configured
        # distro here, so it fails with "execvpe(/bin/bash) failed". pwsh is this
        # repo's standard shell on Windows runners (every other step already uses
        # it); rewritten as PowerShell to avoid the WSL shell-resolution pitfall.
        shell: pwsh
        env:
          CUSTOMER_PAT: ${{ secrets.CUSTOMER_MIRROR_PAT }}
          CUSTOMER_REPO: ${{ matrix.customer.repo }}
        run: |
          # actions/checkout@v4 sets http.https://github.com/.extraheader (an
          # Authorization header carrying GITHUB_TOKEN) scoped to github.com
          # generically, not just the origin repo. libcurl sends that header on
          # EVERY github.com request in this job, overriding any URL-embedded
          # credentials below — so without unsetting it here, this push would
          # silently run as GITHUB_TOKEN (no access to the customer repo) and
          # fail with a misleading "Repository not found" instead of using
          # CUSTOMER_PAT. actions/checkout's own post-job cleanup unsets the
          # same header; we just need it gone before this step, not only after.
          git config --local --unset-all http.https://github.com/.extraheader 2>$null
          $customerUrl = "https://x-access-token:$env:CUSTOMER_PAT@github.com/$env:CUSTOMER_REPO.git"
          git remote add customer $customerUrl 2>$null
          if ($LASTEXITCODE -ne 0) {
            git remote set-url customer $customerUrl
          }
          git push --mirror customer
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAILED: git push --mirror to customer repo failed (exit $LASTEXITCODE)." -ForegroundColor Red
            exit 1
          }
          git remote remove customer

      - name: Assert customer override exists (D-08)
        shell: pwsh
        run: |
          $overridePath = "customers/${{ matrix.customer.name }}/tauri.override.json"
          if (-not (Test-Path -LiteralPath $overridePath)) {
            Write-Host "FAILED: missing override file '$overridePath' for customer '${{ matrix.customer.name }}' - refusing to build with core defaults (D-08)." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: override file '$overridePath' present." -ForegroundColor Green

      - name: generate build cert (Phase 20, DEP-01)
        id: gencert
        shell: pwsh
        run: |
          $output = powershell -File scripts/generate-build-cert.ps1
          $thumbprint = ($output | Select-Object -Last 1).ToString().Trim()
          if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            Write-Host "FAILED: unexpected thumbprint output: '$thumbprint'" -ForegroundColor Red
            exit 1
          }
          echo "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          # WINDOWS.md #51/#54/#55: across 3 real verification rounds, this
          # step's own release-creation call has proven unreliable at
          # reaching the customer's repo — sometimes it 403s (#54), sometimes
          # it silently lands on CORE's repo instead (#55), even with
          # GITHUB_REPOSITORY shadowed below and a PAT that has confirmed
          # contents:write there. This step is KEPT for what it reliably does
          # (build + sign the customer-configured bundles) but is NO LONGER
          # the authoritative publish — that's the explicit "Publish release
          # to customer repo via gh CLI" step below, which is independent of
          # wherever this step's own release call happens to land.
          GITHUB_TOKEN: ${{ secrets.CUSTOMER_MIRROR_PAT }}
          GITHUB_REPOSITORY: ${{ matrix.customer.repo }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Supermarket POS v__VERSION__'
          releaseBody: 'See CHANGELOG.md for release notes.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          projectPath: .
          args: >-
            --config {"bundle":{"windows":{"certificateThumbprint":"${{ steps.gencert.outputs.thumbprint }}","digestAlgorithm":"sha256"}}}
            --config customers/${{ matrix.customer.name }}/tauri.override.json

      - name: Publish release to customer repo via gh CLI (WINDOWS.md #55)
        # SOLE authoritative publish to the customer's repo. Does not depend
        # on tauri-action's own release call above (which has repeatedly
        # proven unreliable — #51/#54/#55) — this step locates the artifacts
        # tauri-action already built+signed on local disk, builds its own
        # updater manifest, and publishes directly with `gh`, which is the
        # same mechanic already proven reliable in 26-05's manual workaround.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CUSTOMER_MIRROR_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ matrix.customer.repo }}'
          $bundleRoot = 'src-tauri/target/release/bundle'

          $tauriConf = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $tauriConf.version
          $tag = "v$version"

          # Glob dynamically, not a hardcoded filename — product-name spacing
          # in the local build output can vary (26-05 finding), and GitHub
          # itself sanitizes spaces to dots when it serves the uploaded asset
          # (confirmed against a real release's actual asset names), so the
          # download URL must use the sanitized name regardless of the local
          # file's raw name.
          $nsisExe = Get-ChildItem -Path (Join-Path $bundleRoot 'nsis') -Filter '*-setup.exe' | Select-Object -First 1
          $nsisSig = Get-ChildItem -Path (Join-Path $bundleRoot 'nsis') -Filter '*-setup.exe.sig' | Select-Object -First 1
          $msiFile = Get-ChildItem -Path (Join-Path $bundleRoot 'msi') -Filter '*.msi' | Select-Object -First 1
          $msiSig = Get-ChildItem -Path (Join-Path $bundleRoot 'msi') -Filter '*.msi.sig' | Select-Object -First 1

          if (-not $nsisExe -or -not $nsisSig -or -not $msiFile -or -not $msiSig) {
            Write-Host "FAILED: could not locate all 4 built artifacts (nsis .exe/.exe.sig, msi/.msi.sig) under '$bundleRoot'." -ForegroundColor Red
            exit 1
          }

          $nsisSignature = (Get-Content -LiteralPath $nsisSig.FullName -Raw).Trim()
          $msiSignature = (Get-Content -LiteralPath $msiSig.FullName -Raw).Trim()
          $nsisSanitizedName = $nsisExe.Name -replace ' ', '.'
          $msiSanitizedName = $msiFile.Name -replace ' ', '.'
          $exeUrl = "https://github.com/$repo/releases/download/$tag/$nsisSanitizedName"
          $msiUrl = "https://github.com/$repo/releases/download/$tag/$msiSanitizedName"
          $pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')

          # Manifest shape matches a real prior release's latest.json byte-for-byte
          # (fetched via `gh release download v1.2.3 --repo zedfauji/supermarket-pos-taj
          # -p latest.json` during this fix's verification) rather than a guessed shape.
          $manifest = [ordered]@{
            version  = $version
            notes    = 'See CHANGELOG.md for release notes.'
            pub_date = $pubDate
            platforms = [ordered]@{
              'windows-x86_64'     = [ordered]@{ signature = $msiSignature; url = $msiUrl }
              'windows-x86_64-msi'  = [ordered]@{ signature = $msiSignature; url = $msiUrl }
              'windows-x86_64-nsis' = [ordered]@{ signature = $nsisSignature; url = $exeUrl }
            }
          }
          $manifestPath = Join-Path $bundleRoot 'latest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifestPath -Encoding utf8 -NoNewline

          $assetPaths = @($nsisExe.FullName, $nsisSig.FullName, $msiFile.FullName, $msiSig.FullName, $manifestPath)

          gh release view $tag --repo $repo *>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists on $repo (retry) - uploading with --clobber." -ForegroundColor Yellow
            gh release upload $tag @assetPaths --repo $repo --clobber
          } else {
            gh release create $tag @assetPaths --repo $repo --title "Supermarket POS $tag" --notes 'See CHANGELOG.md for release notes.'
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAILED: gh release publish to '$repo' for tag '$tag' exited $LASTEXITCODE." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: published $tag to $repo via explicit gh release (WINDOWS.md #55)." -ForegroundColor Green

      - name: Clean up materialized secrets
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path .env.production -Force -ErrorAction SilentlyContinue
          git remote remove customer 2>$null
          exit 0

  publish-tauri:
    permissions:
      contents: write
    environment:
      name: taj-house-of-spices
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      # See the sync-customers job's identical step-level env for why this is
      # isolated (`runner.temp` is only valid in step-level, not job-level, `env:`).
      - name: setup node
        uses: actions/setup-node@v4
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup show

      - name: install frontend dependencies
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        run: npm ci

      - name: Materialize .env.production from Environment secrets
        shell: pwsh
        run: |
          # Values are sourced from the taj-house-of-spices GitHub Environment
          # (this job's `environment:` binding above scopes secret resolution to
          # exactly this Environment — GitHub's own secret-scoping primitive).
          # Never echo the values themselves, only confirm the file was written.
          @"
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          "@ | Set-Content -Path .env.production -Encoding utf8 -NoNewline
          Write-Host "OK: .env.production materialized for this build window." -ForegroundColor Green

      - name: generate build cert (Phase 20, DEP-01)
        id: gencert
        shell: pwsh
        run: |
          # `powershell -File` (external process) merges Write-Host output into
          # captured stdout on this non-interactive host, so $output can contain
          # the script's "OK: ..." progress lines ahead of the real thumbprint.
          # The script's own contract (see its header doc) guarantees the LAST
          # line is always the bare `Write-Output $cert.Thumbprint` value.
          $output = powershell -File scripts/generate-build-cert.ps1
          $thumbprint = ($output | Select-Object -Last 1).ToString().Trim()
          if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            Write-Host "FAILED: unexpected thumbprint output: '$thumbprint'" -ForegroundColor Red
            exit 1
          }
          echo "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Supermarket POS v__VERSION__'
          releaseBody: 'See CHANGELOG.md for release notes.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          projectPath: .
          args: '--config {"bundle":{"windows":{"certificateThumbprint":"${{ steps.gencert.outputs.thumbprint }}","digestAlgorithm":"sha256"}}}'

      - name: Remove materialized .env.production
        if: always()
        shell: pwsh
        run: Remove-Item -Path .env.production -Force -ErrorAction SilentlyContinue
